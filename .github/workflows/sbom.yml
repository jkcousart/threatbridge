name: SBOM verification

on:
  push:
    paths:
      - pyproject.toml
      - requirements/**
      - sbom/**
      - scripts/finalize_sbom.py
      - scripts/generate_sbom.sh
  pull_request:
    paths:
      - pyproject.toml
      - requirements/**
      - sbom/**
      - scripts/finalize_sbom.py
      - scripts/generate_sbom.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.13.14
      - name: Install locked SBOM tooling
        run: python -m pip install --require-hashes -r requirements/development.txt
      - name: Regenerate CycloneDX SBOM
        run: ./scripts/generate_sbom.sh /tmp/threatbridge.cdx.json
      - name: Verify committed SBOM
        run: cmp sbom/threatbridge.cdx.json /tmp/threatbridge.cdx.json
