name: Test, lint, and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.12.13
          - 3.13.14
          - 3.14.4
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/build.txt
            requirements/development.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --require-hashes -r requirements/development.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Validate committed dependency locks without resolution
        run: python scripts/validate_dependency_locks.py
      - name: Validate workflow policy
        run: ./scripts/validate_workflows.py
      - name: Run Ruff
        run: ruff check .
      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest -q
      - name: Check installed dependencies
        run: python -m pip check
      - name: Audit locked runtime dependencies
        run: |
          python -m pip_audit --require-hashes --disable-pip -r requirements/runtime.txt
          python -m pip_audit --require-hashes --disable-pip -r requirements/development.txt
      - name: Run Bandit
        run: python -m bandit -r catalog integrations threatbridge -x '*/tests/*,*/migrations/*'
