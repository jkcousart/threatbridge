[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatbridge"
version = "0.3.0"
description = "Threat-informed integration, evidence, and control-correlation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<7",
  "djangorestframework>=3.15,<4",
  "dj-database-url>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["threatbridge*", "integrations*", "catalog*"]

[tool.setuptools.package-data]
catalog = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "threatbridge.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "*/migrations/*", ".pytest_cache", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
